<!-- 

    Estructuras básicas

    <!DOCTYPE html> declara el tipo de documento y la versión de HTML que se está utilizando. 

    <HTML> Es el elemento raíz que contiene todo el contenido del documento.

    <HEAD> Contiene metadatos sobre el documento: conjunto de caracteres, vista para diapositivas móviles o el título del documento.
    
    <BODY> Contiene el contenido visible del documento, como títulos, párrafos, imágenes, formularios, etc.

-->

<!DOCTYPE html>
<html>
    <head></head>
    <body></body>
</html>
