<!--
Imagenes

Para colocarimagene dentro de html usamos la etiqueta:
<img/>

Esta etiqueta es de autocierre (self closing). En html 5 la 7 ya no es necesaria, pero se considera una buena practica colocarla.

El atributo "src" (sopurce u origen) le indica a la etiqueta la imagen a mostrar. Puede recibir una url externa a la ruta 8path) interna.

El atributo "alt" (alternative u alternativa) es un texto que se mostrara en caso que el navegador no pueda cargar la imagen. Es importante colocar este atributo para mejorar la accesibilidad de los sitios web.

Los atributos "width" y "height" nos permiten cambiar el tamaño de la imagen, directamente en html. aunque lo ideal es hacerlo con CSS.
 -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
</head>
<body>
    <h1>Imagenes</h1>
    <p> Las imagenes nos permiten colocar elementos visuales en los sitios web</p>
    </p>

    <h2>Imagenes externas</h2>
    <img src="https://picsum.photos/200/300" alt="Imagen aleatoria desde Lorem Picsum">

    <h2>Imagenes internas</h2>
    <img src="images/holi.webp" alt="Escena de Fullmetal Alchemist Brotherhood, imagen de Edward Elric" WIDTH="200" HEIGHT="300">


</body>
</html>
