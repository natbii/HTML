<!--
Enlaces

Los enlaces nos permiten crear navegaciones internas y externas 


Sintaxis:
<a>...</a>
Los enlaces requiere del atributo "HREF" para funcionar como elementos de navegacion.

<a href="...">...</a>
El atributo "href" puede recibir varios valores, entre ellos:
URL externa
La ruta (path)
El id de un elemento de html
#Deadlink (enlace muerto)

El atributo "target" nos permite abrir el enlace en una nueva pestaña, cuando usamos el valor "_blank"
-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>
<a href="https://www.tiktok.com" target="_blank">Esto es un enlace externo</a>
