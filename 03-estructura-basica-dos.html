<!-- 

Para crear la estructura básica podemos usar Emmet.

Emmet es una herramienta de autocompletado que integrada en VSC.

El shortcut para escribir la estructura: !

Atributos 

lang: Determina el idioma en que esta escrito el documento
charset: Determina el conjunto de caracteres que se usa en el documento

Etiquetas 
Meta viewport: Permirte que nuestro documento se vea correctamente en dispositivos móviles. Siempre debe de estar. Las etiquetas meta se autoencierran "self-closing"

Title: Define el titulo del documento. Este título sí es visible para el usuario, y se ubica en la pestaña del navegador.
-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiero ir a mi casa a jugar Tomodachiiiiii</title>
</head>
<body>
    
</body>
</html>
