
<!-- 

audio-video

Estas etiquetas nos permiten insetar contenido multimedia.

<audio>...</audio>
<video>...</video>

Parámetros
  -controls: Muestra los controles de las etiquetas 
  -autoplay: Reproduce el contenido de manera automática
  -loop: Repite el contenido en bucle
  -muted: Reproduce el contenido sin sonido

  Elemento Source

  Dentro de las etiquetas de audio y video se define la etiqueta <source /> y a esta etiqueta le pasamos el parametro src que recibe como valor la ubicación del contenido.



  -->

  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio y Video</title>
</head>
<body>
    <h1>Audio y Video</h1>

    <h2>Contenido de audio</h2>
    <audio controls autoplay muted>
        <source src="multimedia/rosa de guadalupe.mp3" />
        Tu navegador no soporta la etiqueta de audio, Cambia a un navegador moderno.
    </audio>

    <h2>Contenido de video</h2>
    <video controls autoplay loop muted width="320" height="240">
        <source src="multimedia/Mitski - A Pearl (Official Video).mp4" />
        Tu navegador no soporta la etiqueta de video, Cambia a un navegador moderno.
    ></video>
</body>
</html>
