<!-- 

Etiquetas genericas

Existen dos que nos ayudan a crear elementos de tipo bloque y línea.}

div Se usa como un contendor de división y semánticamente no aignifica nada. Sirve como contenedor de bloque.
span Se usa como un contendor de línea y semánticamente no aignifica nada. Sirve como contenedor de línea.

Contenedor de bloque- opcupan todo el ancho disponible y darán un salto de linea.

Contenedor de línea- va a ocupar el ancho de su contenido y no da salto de linea.

-->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Etiquetas Genéricas</title> 
    </head>
    <body>
        <h1>Etiquetas Genéricas</h1>
        <div>
            Este es un <span style="color:brown">elemento</span> de bloque.
        </div>

        <div>
            Este es otro elemento de bloque. <span> Y este es otro elemento de línea</span>
            
        </div>

        
    </body>
